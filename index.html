<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141B3D">
<title>성경 골든벨 · 교육 교재</title>
<style>
:root{
  --navy:#1E2761; --navy-d:#141B3D; --navy-l:#2C3670; --ice:#CADCFC;
  --berry:#5A2A47; --berry-d:#3F1C31; --berry-l:#6E3B5B; --rose:#EBD7E3;
  --gold:#F2A65A; --amber:#D9964E;
  --green:#2C5F2D; --green-bg:#EAF2E8;
  --ink:#2A3038; --muted:#7A828C; --edge:#E7E1DC;
  --acc:var(--gold); --dark:var(--navy); --darker:var(--navy-d);
  --darkl:var(--navy-l); --light:var(--ice); --page:#FCF6F5;
  --fs:1;
}
body.nt{--acc:var(--amber);--dark:var(--berry);--darker:var(--berry-d);
  --darkl:var(--berry-l);--light:var(--rose);--page:#FBF5F8;}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
  background:var(--darker);color:var(--ink);
  word-break:keep-all;line-height:1.5;
}

/* ---------- 성경 선택 ---------- */
#menu{position:fixed;inset:0;background:var(--navy-d);overflow-y:auto;z-index:60;
  padding:calc(env(safe-area-inset-top) + 44px) 22px calc(env(safe-area-inset-bottom) + 40px);}
.m-eyebrow{font-size:12px;letter-spacing:.22em;color:var(--gold);font-weight:700;margin-bottom:10px}
.m-title{font-size:30px;font-weight:800;color:#fff;letter-spacing:-.02em;line-height:1.25}
.m-sub{font-size:14px;color:#8FA0D8;margin-top:10px;line-height:1.6}
.m-rule{height:2px;width:44px;background:var(--gold);margin:24px 0 26px;border-radius:2px}
.m-group{font-size:11px;letter-spacing:.2em;color:#6C7AB5;font-weight:700;margin:26px 0 12px}
.m-group:first-of-type{margin-top:0}
.bk{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;
  background:#232C63;border-radius:15px;padding:15px 17px;margin-bottom:9px;cursor:pointer;
  transition:transform .12s ease,background .15s ease}
.bk:active{transform:scale(.975);background:#2B3576}
.bk-n{flex:0 0 40px;height:40px;border-radius:11px;background:rgba(255,255,255,.12);
  display:grid;place-items:center;font-size:15px;font-weight:800;color:#fff}
.bk.n .bk-n{background:rgba(242,166,90,.2);color:var(--gold)}
.bk-t{flex:1;min-width:0;display:block}
.bk-name{display:block;font-size:18px;font-weight:700;color:#fff;letter-spacing:-.01em;line-height:1.3}
.bk-meta{display:block;font-size:12.5px;color:#9AA8DC;margin-top:5px;line-height:1.3}
.bk-bar{display:block;height:3px;background:rgba(255,255,255,.15);border-radius:2px;margin-top:9px;overflow:hidden}
.bk-bar i{display:block;height:100%;background:var(--gold);border-radius:2px}
.bk.done .bk-n{background:rgba(242,166,90,.28);color:var(--gold)}
.bk.n .bk-meta{color:#C9A5BC}
.bk-go{color:#7886C4;font-size:19px}
.m-note{margin-top:30px;padding:16px 18px;background:rgba(255,255,255,.055);
  border-radius:13px;font-size:13px;color:#8FA0D8;line-height:1.75}
.m-note b{color:var(--ice);font-weight:600}

/* ---------- 뷰어 ---------- */
#viewer{position:fixed;inset:0;display:none;flex-direction:column;background:var(--darker)}
#viewer.on{display:flex}

.bar{flex:0 0 auto;padding:calc(env(safe-area-inset-top) + 9px) 15px 9px;
  display:flex;align-items:center;gap:11px;background:var(--darker);z-index:20}
.ico{flex:0 0 36px;height:36px;border-radius:10px;border:0;background:rgba(255,255,255,.1);
  color:#fff;font-size:16px;display:grid;place-items:center;cursor:pointer}
.ico:active{background:rgba(255,255,255,.2)}
.bar-mid{flex:1;min-width:0}
.bar-bk{font-size:14px;font-weight:700;color:#fff;letter-spacing:-.01em}
.bar-pg{font-size:11px;color:rgba(255,255,255,.5);margin-top:1px}
.prog{flex:0 0 auto;height:3px;background:rgba(255,255,255,.13)}
.prog i{display:block;height:100%;background:var(--acc);transition:width .22s ease;border-radius:0 2px 2px 0}

#stage{flex:1;position:relative;overflow:hidden}
.card{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:24px 20px calc(env(safe-area-inset-bottom) + 96px)}

/* 헤더 */
.hd{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.hd-n{flex:0 0 34px;height:34px;border-radius:50%;display:grid;place-items:center;
  font-size:15px;font-weight:800}
.hd-l{font-size:15px;font-weight:800;letter-spacing:.3em}
.hd-s{margin-left:auto;font-size:12px;letter-spacing:.08em}
.tagbox{display:flex;gap:5px;margin-left:8px}
.tg{font-size:10px;font-weight:800;color:#fff;border-radius:4px;padding:2px 6px;letter-spacing:.03em}
.tg.imp{background:#C0392B}.tg.new{background:var(--acc)}
.oxwrap{display:flex;gap:12px;margin-top:14px}
.oxb{flex:1;background:#fff;border:1px solid var(--edge);border-radius:14px;
  padding:26px 0;text-align:center;font-size:calc(44px * var(--fs));font-weight:800;color:var(--acc)}
.card.e .oxans{font-size:calc(64px * var(--fs));font-weight:800;color:var(--green);text-align:center;line-height:1.1}
.exbox{background:#fff;border:1px solid var(--edge);border-radius:16px;padding:34px 20px;text-align:center;margin-top:20px}
.exbox .s1{font-size:calc(15px * var(--fs));color:var(--muted);margin-bottom:8px}
.exbox .s2{font-size:calc(24px * var(--fs));font-weight:800;color:var(--dark)}
.bk-tags{display:flex;gap:5px;margin-top:6px}

/* 말씀 */
.card.v{background:var(--dark)}
.card.v .hd-n{background:#fff;color:var(--dark)}
.card.v .hd-l{color:var(--light)}
.card.v .hd-s{color:var(--acc)}
.verse{color:var(--light);font-weight:500;letter-spacing:-.015em}
.verse b{color:#fff;font-weight:800}
.verse p{margin-bottom:.38em;font-size:calc(21px * var(--fs));line-height:1.52}
.verse p:last-child{margin-bottom:0}
.vref{margin-top:26px;font-size:calc(19px * var(--fs));font-weight:800;color:var(--acc);letter-spacing:-.01em}
.gloss{margin-top:20px;background:var(--darkl);border-radius:13px;padding:14px 16px;
  font-size:calc(14px * var(--fs));color:var(--light);line-height:1.65}
.vfoot{margin-top:28px;font-size:13px;color:rgba(255,255,255,.42)}

/* 질문 */
.card.q{background:var(--page)}
.card.q .hd-n{background:var(--dark);color:#fff}
.card.q .hd-l{color:var(--dark)}
.card.q .hd-s{color:var(--acc)}
.ask{font-size:calc(19px * var(--fs));font-weight:700;color:var(--dark);
  line-height:1.55;letter-spacing:-.015em;margin-bottom:22px}
.opt{display:flex;gap:11px;background:#fff;border:1px solid var(--edge);border-radius:13px;
  padding:14px 15px;margin-bottom:9px}
.opt-n{flex:0 0 auto;font-size:calc(16px * var(--fs));font-weight:800;color:var(--acc);line-height:1.45}
.opt-t{font-size:calc(16px * var(--fs));color:var(--ink);line-height:1.45}
.pad{background:#fff;border:1px solid var(--edge);border-radius:15px;padding:18px}
.pad-l{font-size:13px;font-weight:800;color:var(--acc);letter-spacing:.22em;margin-bottom:13px}
.pad-s{font-size:calc(15px * var(--fs));color:var(--ink);line-height:1.75;
  white-space:pre-wrap;font-variant-numeric:tabular-nums}
.pad-e{font-size:calc(17px * var(--fs));color:var(--muted)}
.pad-line{margin-top:13px;border-top:2px dashed #D8CFC8}
.qfoot{margin-top:24px;font-size:13px;color:var(--muted)}
.vfoot2{margin-top:22px;font-size:13px;color:var(--muted)}

/* 해설 */
.card.e{background:#fff}
.card.e .hd-n{background:var(--green);color:#fff}
.card.e .hd-l{color:var(--green)}
.card.e .hd-s{color:var(--acc)}
.ansbox{background:var(--green-bg);border-radius:14px;padding:22px 20px;margin-bottom:24px}
.ans-l{font-size:12px;font-weight:800;color:var(--green);letter-spacing:.22em;margin-bottom:7px;opacity:.75}
.ans-t{font-size:calc(26px * var(--fs));font-weight:800;color:var(--green);
  line-height:1.4;letter-spacing:-.015em}
.e-sec{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:9px}
.everse{color:var(--ink);margin-bottom:22px}
.everse p{font-size:calc(16px * var(--fs));line-height:1.62;margin-bottom:.18em}
.everse b{font-weight:800;color:var(--green);
  border-bottom:2px solid var(--green);padding-bottom:1px}
.why{background:var(--page);border-radius:14px;padding:16px 17px}
.why-l{font-size:13px;font-weight:800;color:#A85E17;margin-bottom:9px}
.why-t{font-size:calc(15px * var(--fs));color:var(--ink);line-height:1.72}

/* 마무리 */
.card.f{background:var(--dark);display:flex;flex-direction:column;justify-content:center}
.f-l{font-size:calc(27px * var(--fs));font-weight:800;color:var(--light);
  line-height:1.4;letter-spacing:-.02em}
.f-l:last-of-type{color:#fff}
.f-r{margin-top:18px;font-size:calc(16px * var(--fs));color:var(--acc);font-weight:700}
.f-b{margin-top:38px;display:flex;gap:9px;flex-wrap:wrap}
.f-btn{border:0;border-radius:11px;padding:13px 19px;font-size:14px;font-weight:700;
  font-family:inherit;cursor:pointer;background:rgba(255,255,255,.14);color:#fff}
.f-btn.p{background:var(--acc);color:var(--darker)}

/* 네비 */
.nav{position:absolute;left:0;right:0;bottom:0;z-index:15;
  padding:12px 15px calc(env(safe-area-inset-bottom) + 12px);
  display:flex;gap:9px;align-items:center;pointer-events:none}
.nav button{pointer-events:auto;border:0;font-family:inherit;cursor:pointer;
  border-radius:13px;font-weight:700;transition:transform .1s ease}
.nav button:active{transform:scale(.95)}
.nav button:disabled{opacity:.3}
.nb{flex:0 0 52px;height:52px;font-size:19px;
  background:rgba(0,0,0,.5);color:#fff;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.nn{flex:1;height:52px;font-size:16px;background:var(--acc);color:#231A10;letter-spacing:-.01em}
.card.v ~ .nav .nb,.card.f ~ .nav .nb{background:rgba(255,255,255,.16)}

/* 설정 */
#sheet{position:fixed;inset:0;z-index:70;display:none}
#sheet.on{display:block}
.sh-bg{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.sh-p{position:absolute;left:0;right:0;bottom:0;background:#fff;
  border-radius:22px 22px 0 0;padding:10px 20px calc(env(safe-area-inset-bottom) + 26px)}
.sh-h{width:38px;height:4px;background:#DDD;border-radius:2px;margin:0 auto 20px}
.sh-t{font-size:15px;font-weight:800;color:var(--ink);margin-bottom:14px}
.sizes{display:flex;gap:8px;margin-bottom:24px}
.sz{flex:1;border:2px solid var(--edge);background:#fff;border-radius:12px;padding:14px 0;
  font-family:inherit;font-weight:700;color:var(--muted);cursor:pointer}
.sz.on{border-color:var(--dark);color:var(--dark);background:var(--page)}
.sz.a{font-size:14px}.sz.b{font-size:17px}.sz.c{font-size:20px}
.jump{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;max-height:172px;overflow-y:auto}
.jm{aspect-ratio:1;border:1px solid var(--edge);background:#fff;border-radius:9px;
  font-family:inherit;font-size:14px;font-weight:700;color:var(--ink);cursor:pointer}
.jm.on{background:var(--dark);color:#fff;border-color:var(--dark)}

@media (min-width:620px){
  .card{padding:36px 15% calc(env(safe-area-inset-bottom) + 100px)}
  .nav{padding-left:15%;padding-right:15%}
  #menu{padding-left:15%;padding-right:15%}
}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="menu">
  <div class="m-eyebrow">성경 골든벨 · 교육 교재</div>
  <div class="m-title">스스로 풀고<br>말씀으로 확인해요</div>
  <div class="m-sub">동대문지방 성경골든벨 · 본선 대비 253문항<br>전농감리교회 교육부</div>
  <div class="m-rule"></div>
  <div id="mlist"></div>
  <div class="m-note">
    <b>질문 → 정답 → 말씀</b> 순서로 넘어갑니다.<br>
    <b>중요</b>는 서술형, <b>신규</b>는 새로 나온 문항이에요.<br>
    답을 떠올린 뒤에 넘기고, 마지막 말씀에서 정답이 들어 있는 부분을 확인해 보세요.
  </div>
</div>

<div id="viewer">
  <div class="bar">
    <button class="ico" id="home">☰</button>
    <div class="bar-mid"><div class="bar-bk" id="bkName"></div><div class="bar-pg" id="bkPage"></div></div>
    <button class="ico" id="cog">Aa</button>
  </div>
  <div class="prog"><i id="pbar"></i></div>
  <div id="stage"></div>
</div>

<div id="sheet">
  <div class="sh-bg" id="shbg"></div>
  <div class="sh-p">
    <div class="sh-h"></div>
    <div class="sh-t">글자 크기</div>
    <div class="sizes">
      <button class="sz a" data-f="0.9">작게</button>
      <button class="sz b on" data-f="1">보통</button>
      <button class="sz c" data-f="1.18">크게</button>
    </div>
    <div class="sh-t">문항 바로가기</div>
    <div class="jump" id="jump"></div>
  </div>
</div>

const CIRC = ["①","②","③","④"];
const esc = s => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const stars = n => "★".repeat(n) + "☆".repeat(3-n);
const seg = (line, hl) => line.split(/(\[\[.*?\]\])/).filter(Boolean).map(p =>
  p.startsWith("[[") ? (hl ? "<b>"+esc(p.slice(2,-2))+"</b>" : esc(p.slice(2,-2))) : esc(p)).join("");

let bi = 0, si = 0, slides = [];

const KEY = "jeonnong_goldenbell_v1";
function loadP(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } }
function saveP(){ try{ const p = loadP(); p[bi] = si; localStorage.setItem(KEY, JSON.stringify(p)); }catch(e){} }

function buildSlides(b){
  const out = [];
  b.qs.forEach((q, i) => {
    if (q.excluded){ out.push({k:"q", n:q.n, q}); return; }
    out.push({k:"q", n:q.n, q});
    out.push({k:"e", n:q.n, q});
    out.push({k:"v", n:q.n, q});
  });
  out.push({k:"f", b});
  return out;
}

function head(n, label, ref, lv, q){
  var t='';
  if(q){
    t='<span class="tagbox">'
      +(q.type==="essay"?'<span class="tg imp">중요</span>':'')
      +(q.isnew?'<span class="tg new">신규</span>':'')+'</span>';
  }
  return '<div class="hd"><div class="hd-n">'+n+'</div><div class="hd-l">'+label+
    '</div>'+t+'<div class="hd-s">'+esc(ref)+'　'+stars(lv)+'</div></div>';
}

function render(s){
  if (s.k === "f"){
    return '<div class="card f">'+
      s.b.closing.map(l => '<div class="f-l">'+esc(l)+'</div>').join('')+
      '<div class="f-r">'+esc(s.b.closingRef)+'</div>'+
      '<div class="f-b"><button class="f-btn p" id="again">다시 보기</button>'+
      '<button class="f-btn" id="tolist">다른 성경 고르기</button></div></div>';
  }
  const q = s.q;
  if (s.k === "v"){
    return '<div class="card v">'+head(s.n,"말 씀",q.ref,q.lv,q)+
      '<div class="verse">'+q.v.map(l => '<p>'+seg(l,true)+'</p>').join('')+'</div>'+
      '<div class="vref">'+esc(q.ref)+'</div>'+
      (q.gloss ? '<div class="gloss">'+esc(q.gloss)+'</div>' : '')+
      '<div class="vfoot">소리 내어 읽어 봅시다</div></div>';
  }
  if (s.k === "q"){
    if (q.excluded){
      return '<div class="card q">'+head(s.n,"질 문",q.ref,q.lv,q)+
        '<div class="exbox"><div class="s1">이 문항은</div>'+
        '<div class="s2">선생님께 물어보세요</div></div>'+
        '<div class="qfoot">선생님이 따로 설명해 주실 거예요</div></div>';
    }
    let body;
    if (q.type === "ox"){
      body = '<div class="oxwrap"><div class="oxb">O</div><div class="oxb">X</div></div>';
    } else if (q.opts){
      body = q.opts.map((o,i) => '<div class="opt"><div class="opt-n">'+CIRC[i]+
        '</div><div class="opt-t">'+esc(o)+'</div></div>').join('');
    } else if (q.stem){
      body = '<div class="pad"><div class="pad-l">'+esc(q.boxLabel||"서 술 형").replace(/ /g,"&nbsp;")+
        '</div><div class="pad-s">'+esc(q.stem)+'</div></div>';
    } else {
      body = '<div class="pad"><div class="pad-l">서&nbsp;술&nbsp;형</div>'+
        '<div class="pad-e">답을 떠올려 보세요</div><div class="pad-line"></div></div>';
    }
    return '<div class="card q">'+head(s.n,"질 문",q.ref,q.lv,q)+
      '<div class="ask">'+esc(q.q)+'</div>'+body+
      (q.gloss?'<div class="qfoot">'+esc(q.gloss)+'</div>':'<div class="qfoot">말씀을 떠올려 보세요</div>')+'</div>';
  }
  const at = q.ansText ? q.ansText : CIRC[q.ans-1]+"　"+q.opts[q.ans-1];
  const inner = (q.type==="ox") ? '<div class="oxans">'+esc(at)+'</div>'
              : '<div class="ans-t">'+esc(at)+'</div>';
  return '<div class="card e">'+head(s.n,"정 답",q.ref,q.lv,q)+
    '<div class="ansbox"><div class="ans-l">정 답</div>'+inner+'</div>'+
    '<div class="why"><div class="why-l">왜 그럴까요?</div><div class="why-t">'+esc(q.ex)+'</div></div></div>';
}

const stage = document.getElementById("stage");
function draw(){
  const s = slides[si];
  stage.innerHTML = render(s) +
    '<div class="nav"><button class="nb" id="prev">‹</button>'+
    '<button class="nn" id="next">'+(s.k==="q"?"정답 확인":s.k==="e"?"말씀 보기":s.k==="v"?"다음 문항":"처음으로")+'</button></div>';
  const p = document.getElementById("prev"); p.disabled = si === 0;
  p.onclick = () => go(-1);
  document.getElementById("next").onclick = () => si >= slides.length-1 ? openMenu() : go(1);
  const a = document.getElementById("again"); if (a) a.onclick = () => { si = 0; draw(); };
  const t = document.getElementById("tolist"); if (t) t.onclick = openMenu;

  const total = BOOKS[bi].qs.length;
  const cur = s.k === "f" ? total : s.n;
  document.getElementById("bkPage").textContent =
    s.k === "f" ? "마침" : cur + " / " + total + " 문항";
  document.getElementById("pbar").style.width = ((si+1)/slides.length*100)+"%";
  stage.querySelector(".card").scrollTop = 0;
  saveP();
}
function go(d){
  const n = si + d;
  if (n < 0 || n >= slides.length) return;
  si = n; draw();
}

function openBook(i, resume){
  bi = i; slides = buildSlides(BOOKS[i]);
  const p = loadP();
  si = (resume && p[i] && p[i] < slides.length) ? p[i] : 0;
  document.body.className = BOOKS[i].testament === "nt" ? "nt" : "";
  document.getElementById("bkName").textContent = BOOKS[i].name;
  document.getElementById("menu").style.display = "none";
  document.getElementById("viewer").classList.add("on");
  buildJump(); draw();
}
function openMenu(){
  document.getElementById("viewer").classList.remove("on");
  document.getElementById("menu").style.display = "block";
  document.body.className = "";
  drawList();
}

    h += '<button class="bk'+(b.testament==="nt"?" n":"")+(at?" done":"")+'" data-i="'+i+'">'+
      '<span class="bk-n">'+(i+1)+'</span><span class="bk-t">'+
      '<span class="bk-name">'+b.name+'</span>'+
      '<span class="bk-meta">'+(at ? qn+'번 문항까지 봤어요' : b.qs.length+'문항 · 신규 '+b.qs.filter(x=>x.isnew).length)+'</span>'+
      (at ? '<span class="bk-bar"><i style="width:'+pct+'%"></i></span>' : '')+
      '</span><span class="bk-go">›</span></button>';
  });
  wrap.innerHTML = h;
  wrap.querySelectorAll(".bk").forEach(el =>
    el.onclick = () => openBook(+el.dataset.i, true));
}
drawList();

/* 설정 */
const sheet = document.getElementById("sheet");
document.getElementById("cog").onclick = () => sheet.classList.add("on");
document.getElementById("shbg").onclick = () => sheet.classList.remove("on");
document.getElementById("home").onclick = openMenu;
document.querySelectorAll(".sz").forEach(b => b.onclick = () => {
  document.querySelectorAll(".sz").forEach(x => x.classList.remove("on"));
  b.classList.add("on");
  document.documentElement.style.setProperty("--fs", b.dataset.f);
});
function buildJump(){
  const j = document.getElementById("jump");
  j.innerHTML = BOOKS[bi].qs.map((_,i) =>
    '<button class="jm" data-q="'+i+'">'+(i+1)+'</button>').join('');
  j.querySelectorAll(".jm").forEach(el => el.onclick = () => {
    si = (+el.dataset.q)*3; sheet.classList.remove("on"); draw();
  });
}

/* 조작 */
document.addEventListener("keydown", e => {
  if (!document.getElementById("viewer").classList.contains("on")) return;
  if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); go(1); }
  if (e.key === "ArrowLeft") go(-1);
  if (e.key === "Escape") openMenu();
});
let sx = 0, sy = 0, st = 0;
stage.addEventListener("touchstart", e => {
  sx = e.touches[0].clientX; sy = e.touches[0].clientY; st = Date.now();
}, {passive:true});
stage.addEventListener("touchend", e => {
  const dx = e.changedTouches[0].clientX - sx;
  const dy = e.changedTouches[0].clientY - sy;
  if (Date.now()-st < 600 && Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy)*1.8)
    go(dx < 0 ? 1 : -1);
}, {passive:true});
</script>
